[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "collusion-experiment"
version = "0.1.0"
description = "Full-history Q-learning against three OpenAI pricing agents"
requires-python = ">=3.11"
dependencies = ["torch>=2.5,<3"]

[project.scripts]
collusion = "collusion.cli:main"

[tool.setuptools.packages.find]
include = ["collusion*"]
